title: Project

status:
  draft:
    label: Draft
    text: Not visible on the site. Only editors with Panel access can see it.
  unlisted:
    label: In review
    text: Hidden from the Work overview. Still reachable via direct URL for preview.
  listed:
    label: Published
    text: Visible on the Work overview and publicly accessible.

tabs:
  content:
    label: Content
    fields:
      section_hero:
        label: Hero
        type: headline
        help: The large opening section at the top of the project page.
      hero_image:
        label: Background image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Falls back to the Work page cover image if empty.
      hero_curtain_opacity:
        label: Image darken
        type: range
        min: 0.1
        max: 0.3
        step: 0.05
        default: 0.15
        width: 1/2
        help: Darkens the background so the title stays readable. Center is the default.
      title_type:
        label: Title display
        type: radio
        default: text
        options:
          text: Text (page title)
          logo: Logo image
      title_logo:
        label: Title logo
        type: files
        multiple: false
        help: SVG or PNG with transparent background.
        accept:
          mime: image/*
        when:
          title_type: logo
      director:
        label: Director
        type: text
        width: 1/2
      writer:
        label: Writer
        type: text
        width: 1/2
      intro:
        label: Intro text
        type: textarea
        size: small
        buttons: false
        help: Short line shown below the title in the hero.
      trailer_source:
        label: Trailer
        type: radio
        default: none
        options:
          none: None
          vimeo: Vimeo
          file: Uploaded file
      trailer_vimeo:
        label: Vimeo URL
        type: url
        when:
          trailer_source: vimeo
      trailer_file:
        label: Video file
        type: files
        multiple: false
        accept:
          mime: video/*
        when:
          trailer_source: file

      section_synopsis:
        label: Synopsis
        type: headline
      synopsis:
        label: Synopsis text
        type: textarea
        size: medium
        buttons: false

      section_details:
        label: Project details
        type: headline
        help: Shown below the synopsis on the project page.
      project_type:
        label: Type
        type: multiselect
        options:
          type: query
          query: site.project_types.split
        width: 1/2
      year:
        label: Year
        type: number
        placeholder: YYYY
        width: 1/4
      credits:
        label: Credits
        type: structure
        fields:
          role:
            label: Role
            type: text
            width: 1/3
          names:
            label: Names
            type: textarea
            buttons: false
            width: 2/3
            help: One name per line. Links can be added with Kirby’s link button.
      cast_crew_url:
        label: Full cast & crew link
        type: url
        help: Optional external link shown below the credits list.

      section_recognition:
        label: Awards & laurels
        type: headline
      awards:
        label: Awards & nominations
        type: structure
        fields:
          title:
            label: Award title
            type: text
          project_page:
            label: Project page
            type: pages
            query: site.find('work').children.listed
            max: 1
            empty: No link
          project:
            label: Project name
            type: text
            help: Display name when no project page is selected. Falls back to the linked page title when empty.
          year:
            label: Year
            type: number
            placeholder: YYYY
            min: 1900
            max: 2100
      laurels:
        label: Laurels
        type: files
        multiple: true
        layout: cards
        uploads: false
        query: site.files.filterBy("template", "laurel").sortBy("sort", "asc")
        help: Select laurel logos from the global library (Site → Laurels).

      section_pull_quote:
        label: Pull quote
        type: headline
      pull_quote:
        label: Quote text
        type: textarea
        buttons: false
      pull_quote_source:
        label: Source
        type: text

      section_slideshow:
        label: Slideshow
        type: headline
        help: Full-width image carousel shown before the featured quote.
      slideshow:
        label: Images
        type: files
        layout: cards
        multiple: true
        accept:
          mime: image/*

      section_featured_quote:
        label: Featured quote
        type: headline
        help: Single quote card shown before the gallery.
      featured_quote_text:
        label: Quote text
        type: textarea
        buttons: false
      featured_quote_source:
        label: Source / citation
        type: text
      featured_quote_stars:
        label: Stars
        type: range
        icon: star
        min: 1
        max: 5
        step: 1
        default: 5
        tooltip:
          after: ★

      section_gallery:
        label: Gallery
        type: headline
      gallery:
        label: Images
        type: files
        layout: cards
        multiple: true
        accept:
          mime: image/*

      section_quote_carousel:
        label: Quote carousel
        type: headline
        help: Optional. Additional quotes in a carousel below the gallery.
      featured_quotes:
        label: Quotes
        type: structure
        fields:
          quote:
            label: Quote text
            type: textarea
            buttons: false
          source:
            label: Source / citation
            type: text
          stars:
            label: Stars
            type: range
            icon: star
            min: 1
            max: 5
            step: 1
            default: 5
            tooltip:
              after: ★

      section_availability:
        label: Streaming & links
        type: headline
        help: Shown in the floating bar at the bottom of the project page.
      available_on:
        label: Available on
        type: structure
        fields:
          medium:
            label: Platform
            type: text
          url:
            label: URL
            type: url

      section_work_card:
        label: Work page card
        type: headline
        help: Thumbnail and summary shown on the Work overview — not part of the project page layout.
      cover:
        label: Cover image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Thumbnail on the Work page. Also used as the hero background if no hero image is set.
      subtitle:
        label: Subtitle
        type: text
        placeholder: e.g. Writer, Director, Producer
        help: Shown under the title on the Work page.
      project_status:
        label: Status
        type: multiselect
        width: 1/2
        options:
          type: query
          query: site.project_statuses.split
        help: Used for filtering on the Work page.

  display:
    extends: tabs/display
  files:
    extends: tabs/files
  seo:
    extends: tabs/seo

title: News Article

status:
  draft:
    label: Draft
    text: Not visible on the site. Only editors with Panel access can see it.
  unlisted:
    label: In review
    text: Hidden from the news overview. Still reachable via direct URL for preview.
  listed:
    label: Published
    text: Visible on the news overview and publicly accessible.

tabs:
  content:
    label: Content
    fields:
      published_date:
        label: Published date
        type: date
        required: true
      cover_image:
        label: Cover image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Shown on the News overview page.
      hero_image:
        label: Hero image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Shown at the top of the article page.
      info:
        label: Info / metadata
        type: structure
        fields:
          label:
            label: Label
            type: text
          value:
            label: Text or URL
            type: text
            help: Plain text, URL, or email address.
      body:
        label: Body
        type: textarea
        size: large
      content_blocks:
        label: Content blocks
        type: blocks
        help: Optional gallery and quote blocks shown below the article body.
        fieldsets:
          - project-gallery
          - featured-quote
      external_links:
        label: External links
        type: structure
        fields:
          label:
            label: Label
            type: text
            placeholder: e.g. Read on Variety
          url:
            label: URL
            type: url
  display:
    extends: tabs/display
    fields:
      page_theme:
        default: light
  seo:
    extends: tabs/seo

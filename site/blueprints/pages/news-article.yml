title: News Article

status:
  draft:
    label: Draft
    text: Not visible on the site. Only editors with Panel access can see it.
  unlisted:
    label: In review
    text: Hidden from the news overview. Still reachable via direct URL for preview.
  listed:
    label: Published
    text: Visible on the news overview and publicly accessible.

tabs:
  content:
    label: Content
    fields:
      published_date:
        label: Published date
        type: date
        required: true
      cover_image:
        label: Cover image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Shown on the News overview page.
      hero_image:
        label: Hero image
        type: files
        multiple: false
        accept:
          mime: image/*
        help: Shown at the top of the article page.
      info:
        label: Info / metadata
        type: structure
        fields:
          label:
            label: Label
            type: text
          value:
            label: Text or URL
            type: text
            help: Plain text, URL, or email address.
      body:
        label: Body
        type: textarea
        size: large
        buttons: false
      external_url:
        label: External link
        type: url
      secondary_image:
        label: Secondary image
        type: files
        multiple: false
        accept:
          mime: image/*
      pull_quote:
        label: Pull quote
        type: textarea
        buttons: false
      pull_quote_caption:
        label: Pull quote caption
        type: text
  display:
    extends: tabs/display
    fields:
      page_theme:
        default: light
  seo:
    extends: tabs/seo

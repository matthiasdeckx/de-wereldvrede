title: About

tabs:
  content:
    label: Content
    fields:
      intro_text:
        label: Intro
        type: textarea
        size: small
        buttons: false
      show_team:
        label: Show team members section
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
      team:
        label: Team members
        type: structure
        when:
          show_team: true
        fields:
          name:
            label: Name
            type: text
          role:
            label: Role
            type: text
          image:
            label: Portrait
            type: files
            multiple: false
            accept:
              mime: image/*
      show_about:
        label: Show about section
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
      about_label:
        label: About section label
        type: text
        default: DE WERELDVREDE
        when:
          show_about: true
      about_body:
        label: About body
        type: textarea
        size: large
        buttons: false
        when:
          show_about: true
      show_awards:
        label: Show awards & nominations section
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
      awards_label:
        label: Awards section label
        type: text
        default: AWARDS & NOMINATIONS
        when:
          show_awards: true
      awards:
        label: Awards & nominations
        type: structure
        when:
          show_awards: true
        fields:
          title:
            label: Award title
            type: text
          project_page:
            label: Project page
            type: pages
            query: site.find('work').children.listed
            max: 1
            empty: No link
          project:
            label: Project name
            type: text
            help: Display name when no project page is selected. Falls back to the linked page title when empty.
          year:
            label: Year
            type: number
            placeholder: YYYY
            min: 1900
            max: 2100
      gallery:
        label: Gallery images
        type: files
        layout: cards
        multiple: true
        accept:
          mime: image/*
  display:
    extends: tabs/display
  files:
    extends: tabs/files
  seo:
    extends: tabs/seo

title: News

tabs:
  articles:
    label: Articles
    icon: page
    sections:
      articles:
        extends: sections/news
        headline: Articles
        help: Articles are sorted by published date (newest first). Set a published date on each article.
  display:
    extends: tabs/display
    fields:
      page_theme:
        default: light
      card_image_layout:
        label: Card image layout
        type: radio
        default: original
        options:
          original: Keep original image ratio
          landscape: Crop to landscape (16:9)
          portrait: Crop to portrait (3:4)
  seo:
    extends: tabs/seo

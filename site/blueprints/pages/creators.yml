title: Creators

tabs:
  content:
    label: Content
    fields:
      creators:
        label: Creators
        type: structure
        columns:
          name:
            width: 1/4
          role:
            width: 1/4
          bio:
            width: 1/4
          portrait:
            width: 1/4
        fields:
          name:
            label: Name
            type: text
          role:
            label: Role
            type: text
          bio:
            label: Bio
            type: textarea
            buttons: false
          portrait:
            label: Portrait
            type: files
            multiple: false
            accept:
              mime: image/*
          external_link:
            label: External link
            type: url
            placeholder: https://www.imdb.com/name/...
          external_link_label:
            label: External link label
            type: text
            placeholder: IMDB
            default: IMDB
          productions:
            label: Productions
            type: pages
            query: site.find('work').children.listed
            multiple: true
            help: Link to existing Work projects.
          custom_productions:
            label: Custom productions
            type: structure
            help: Free-form titles that are not Work pages. External link and year are optional.
            fields:
              title:
                label: Title
                type: text
                required: true
              year:
                label: Year
                type: text
                width: 1/4
              url:
                label: External link
                type: url
                width: 3/4
                help: Optional. Leave empty to show the title without a link.
  display:
    extends: tabs/display
    fields:
      page_theme:
        default: light
  files:
    extends: tabs/files
  seo:
    extends: tabs/seo
